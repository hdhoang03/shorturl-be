server:
  port: 8080

spring:
  application:
    name: shorturl

  # Cấu hình kết nối MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/shorturl_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Domain cơ sở để tạo link ngắn trả về cho client
app:
  base-url: http://localhost:8080/

# Cấu hình Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true