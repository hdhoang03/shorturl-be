version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shorturl_mysql
    restart: always
    environment:
      MYSQL_DATABASE: shorturl_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: shorturl_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: